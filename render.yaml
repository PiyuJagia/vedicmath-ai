# Render Blueprint for the VedicMath AI frontend (static site).
#
# The FastAPI backend is the existing Render web service "vedicmath-ai"
# (https://vedicmath-ai.onrender.com), configured in the Render Dashboard:
#   Build:  pip install -r backend/requirements.txt
#   Start:  uvicorn backend.main:app --host 0.0.0.0 --port $PORT
#   Python: 3.12.10 from .python-version
#   ALLOWED_ORIGINS: the static site's URL (for CORS)
# It is intentionally not listed here, so this Blueprint never changes it.
services:
  - type: web
    runtime: static
    name: vedicmath-ai-web
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://vedicmath-ai.onrender.com
      - key: NODE_VERSION
        value: 24.22.1
    routes:
      # Single-page app: every page path is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
