<div class="game"><canvas id="scene" role="img" aria-label="Rear view of a young explorer balancing on a floating platform in a stormy ocean, facing a distant island"></canvas><div class="vignette"></div><header><strong>❀ &nbsp; VedicMath AI</strong><span class="tag">PLAY TO WIN &nbsp; / &nbsp; NIKHILAM</span><span class="pill">✧ &nbsp; Ocean Explorer</span></header><div class="title"><div class="eyebrow">THE SAPPHIRE CROSSING</div><h1>Treasure Trail</h1><p>Find your courage. Follow the stones.</p></div><div class="question" aria-live="polite"><div class="eyebrow" id="step"></div><h2 id="prompt"></h2><p id="hint"></p></div><div class="answers" id="answers"></div><div class="hud"><div class="coach"><span>YOUR TRAIL COMPANION</span><p id="encourage"></p></div><div class="progress"><strong id="progress"></strong><div class="dots" id="dots"></div><button class="motion" id="motion">Pause ocean motion</button></div></div><div class="footer"><div class="screens"><button data-screen="start">01 · Shore</button><button data-screen="crossing">02 · Open water</button><button data-screen="retry">03 · Game over</button><button data-screen="win">04 · Island</button></div><span class="notice">TEST PREVIEW · BADGE NOT SAVED</span></div><section class="modal hidden" id="modal" aria-live="polite"></section></div>
<script>
const $=s=>document.querySelector(s),canvas=$('#scene'),ctx=canvas.getContext('2d');let W,H,dpr,step=0,a=97,b=93,mode='start',jump=null,cam=0,time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,ended=false;const xPositions=[0,0,0,0,0,0,0];let cameraX=1.8;const lanes=[-6,0,6];
function resize(){W=innerWidth;lanes.splice(0,3,...(W<760?[-4.1,0,4.1]:[-6,0,6]));H=Math.max(innerHeight,innerWidth<760?780:720);dpr=Math.min(devicePixelRatio,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function wave(x,z,t=time){return .3*Math.sin(z*.75+t*1.6+x*.45)+.16*Math.sin(x*1.25-z*.4+t*1.9)+.07*Math.sin(z*2.4+x*2+t*3)}
function project(x,y,z){const depth=Math.max(.6,z-(cam-9)),f=Math.min(W*1.2,760);return {x:W/2+(x-cameraX)*f/depth,y:H*.37+(3.9-y)*f/depth,s:f/depth}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function path(points,color,width){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function island(){const p=project(0,0,95);p.y=H*(W<760?.43:.37)+10;const s=Math.min(W/18,p.s*(2.9+.28*step/6));ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,W<760?.55:.65);ctx.translate(-p.x,-p.y);const glow=ctx.createRadialGradient(p.x,p.y-6*s,0,p.x,p.y-4*s,21*s);glow.addColorStop(0,'#ffe4a971');glow.addColorStop(1,'#f5d89500');ctx.fillStyle=glow;ctx.fillRect(p.x-24*s,p.y-28*s,48*s,40*s);
ctx.save();ctx.globalAlpha=.55;['#eea1a3','#f5ce8b','#f5e3a1','#9bd7b1','#9dcadf'].forEach((color,i)=>{ctx.beginPath();ctx.arc(p.x,p.y-2*s,(13-i*.5)*s,Math.PI,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=s*.48;ctx.stroke();});ctx.restore();
poly([{x:p.x-15*s,y:p.y},{x:p.x-11*s,y:p.y-3*s},{x:p.x-7*s,y:p.y-9*s},{x:p.x-1*s,y:p.y-5*s},{x:p.x+4*s,y:p.y-10*s},{x:p.x+10*s,y:p.y-3*s},{x:p.x+15*s,y:p.y}], '#368e74');poly([{x:p.x-10*s,y:p.y-2*s},{x:p.x-7*s,y:p.y-9*s},{x:p.x-3*s,y:p.y-4*s},{x:p.x-1*s,y:p.y-5*s},{x:p.x+4*s,y:p.y-10*s},{x:p.x+9*s,y:p.y-2*s}], '#72b681');ellipse(p.x,p.y,15*s,1.5*s,'#efd18d');ellipse(p.x,p.y+s*.6,12*s,.6*s,'#ffe9b2');
path([[p.x+4*s,p.y-8*s],[p.x+3*s,p.y-4*s],[p.x+4*s,p.y-s]],'#a0eced',s*1.2);path([[p.x+3.85*s,p.y-8*s],[p.x+2.85*s,p.y-4*s],[p.x+3.85*s,p.y-s]],'#e5ffff',s*.25);ellipse(p.x+4*s,p.y-s,2*s,.4*s,'#caf4e9');
for(const xx of [-11,-8,10,12]){const bx=p.x+xx*s,by=p.y-s;path([[bx,by],[bx-s,by-5*s],[bx-.5*s,by-8*s]],'#85633c',s*.45);for(let k=-2;k<=2;k++)path([[bx-.5*s,by-8*s],[bx+k*1.8*s,by-(8.5-Math.abs(k)*.4)*s],[bx+k*2.6*s,by-(7-Math.abs(k)*.5)*s]],'#28785d',s*.4);}
for(const [xx,hh] of [[-3,6],[-.5,8],[2,5.5]]){const bx=p.x+xx*s,by=p.y-2*s;ctx.fillStyle='#f6dab4';ctx.fillRect(bx-s*.65,by-hh*s,1.3*s,hh*s);poly([{x:bx-s,y:by-hh*s},{x:bx,y:by-(hh+1.3)*s},{x:bx+s,y:by-hh*s}],'#aa83b7');path([[bx,by-(hh+1.3)*s],[bx,by-(hh+3)*s]],'#e5cb8f',s*.12);poly([{x:bx,y:by-(hh+3)*s},{x:bx+1.6*s,y:by-(hh+2.6)*s},{x:bx,y:by-(hh+2.1)*s}],'#f1b35f');ctx.fillStyle='#70949a';ctx.fillRect(bx-s*.2,by-(hh-1)*s,s*.4,s*.8);}
ctx.fillStyle='#b87539';ctx.fillRect(p.x-1.5*s,p.y-1.4*s,3*s,1.6*s);ctx.strokeStyle='#ffe4a0';ctx.lineWidth=s*.2;ctx.strokeRect(p.x-1.5*s,p.y-1.4*s,3*s,1.6*s);ctx.fillStyle='#ffe8a2';ctx.fillRect(p.x-s*.3,p.y-s*.9,s*.6,s*.6);for(const [xx,yy] of [[-5,-2],[6,-6],[0,-14]]){const x=p.x+xx*s,y=p.y+yy*s,r=s*(.35+.12*Math.sin(time*2+xx));poly([{x,y:y-r},{x:x+r*.3,y:y-r*.3},{x:x+r,y},{x:x+r*.3,y:y+r*.3},{x,y:y+r},{x:x-r*.3,y:y+r*.3},{x:x-r,y},{x:x-r*.3,y:y-r*.3}],'#fff1b6');}ctx.font=`italic ${W<760?15:21}px Georgia`;ctx.fillStyle='#fff0bc';ctx.textAlign='center';ctx.restore();}
function sea(){for(let z=100;z>cam-7;z-=.7){for(let x=-40;x<40;x+=1.15){const y=wave(x,z),p=[project(x,y,z),project(x+1.2,wave(x+1.2,z),z),project(x+1.2,wave(x+1.2,z-.74),z-.74),project(x,wave(x,z-.74),z-.74)];const light=(wave(x,z-0.2)-y)*14,depth=Math.min(1,(z-cam+8)/65);poly(p,`hsl(${195-depth*7} ${40+depth*4}% ${25+depth*15+light}%)`);if(y>.36&&z<cam+38){ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);ctx.strokeStyle=`rgba(218,241,231,${Math.min(.55,(y-.36)*2)})`;ctx.lineWidth=Math.max(.7,2-depth);ctx.stroke();}}}}
function platform(i,offset=0){const z=i*14,x=xPositions[i]+offset,height=wave(x,z)*.65+.7,p=project(x,height,z),s=p.s*(i===step?1:(W<760?2.2:2.45)),tilt=Math.sin(time*1.6+z*.75)*.07;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(tilt);ellipse(0,s*.24,s*1.28,s*.36,'#032c3b60');poly([{x:-s*1.15,y:0},{x:s*1.15,y:0},{x:s*.92,y:s*.45},{x:-s*.94,y:s*.45}],'#5c6462');ellipse(0,0,s*1.2,s*.38,'#9ca999');ellipse(0,-s*.025,s*1.12,s*.31,'#bdc4ac');ctx.strokeStyle='#eff1d53b';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,s*1.18,s*.37,0,Math.PI,Math.PI*2);ctx.stroke();path([[-s*.6,-s*.07],[-s*.18,s*.03],[-s*.1,s*.2]],'#8c9788',s*.018);ctx.restore();}
function child(){if(mode==='retry')return;let z=step*14,x=xPositions[step],y=.7+wave(x,z)*.65,scale=1;let lean=Math.sin(time*1.6+z*.75)*.075;if(jump){const t=Math.min(1,(performance.now()-jump.at)/1100),smooth=t*t*(3-2*t);z=jump.from*14+14*smooth;x=xPositions[jump.from]+(jump.targetX-xPositions[jump.from])*smooth;cameraX=xPositions[jump.from]+(jump.targetX-xPositions[jump.from])*smooth+1.8;y+=Math.sin(t*Math.PI)*2.6;lean=-Math.sin(t*Math.PI)*.15;cam=jump.from*14+14*smooth;if(jump.wrong){y-=Math.max(0,(t-.55)/.45)**2*5;scale=1-t*.35;}}const p=project(x,y,z),s=p.s*scale;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(lean);ctx.scale(s,s);ellipse(0,0,.42,.09,'#172b2b55');path([[-.23,-.6],[-.28,-.12],[-.33,-.04]],'#eadbc0',.28);path([[.23,-.6],[.3,-.12],[.35,-.04]],'#eadbc0',.28);path([[-.35,-.05],[-.55,-.02]],'#c5956f',.15);path([[.34,-.05],[.53,-.02]],'#c5956f',.15);poly([{x:-.35,y:-1.5},{x:.35,y:-1.5},{x:.41,y:-.59},{x:-.41,y:-.59}],'#f3e4cd');const arm=Math.sin(time*2)*.06;path([[-.33,-1.39],[-.7,-1.1+arm],[-.96,-1.13+arm]],'#c5956f',.16);path([[.33,-1.39],[.73,-1.12-arm],[1,-1.25-arm]],'#c5956f',.16);ellipse(-.99,-1.13+arm,.1,.12,'#cda17a');ellipse(1,-1.25-arm,.1,.12,'#cda17a');path([[-.25,-1.47],[.1,-1.04],[.37,-.73]],'#9a7cba',.22);path([[-.29,-1.43],[.03,-1.03],[.32,-.75]],'#b19acb',.055);path([[-.36,-.66],[.38,-.66]],'#9576b2',.14);poly([{x:.1,y:-.66},{x:.3,y:-.65},{x:.47,y:-.2},{x:.25,y:-.26}],'#ab8fc6');path([[-.17,-.61],[-.19,-.28]],'#d7c5a8',.025);ellipse(0,-1.72,.17,.17,'#b18465');ellipse(0,-1.99,.37,.43,'#ad805f');ellipse(-.37,-1.94,.065,.12,'#ba8b6c');ellipse(.37,-1.94,.065,.12,'#ba8b6c');ctx.fillStyle='#342e2c';ctx.beginPath();ctx.moveTo(-.36,-1.85);ctx.bezierCurveTo(-.54,-2.47,.39,-2.62,.39,-2.02);ctx.lineTo(.3,-1.8);ctx.quadraticCurveTo(0,-1.65,-.36,-1.85);ctx.fill();ctx.beginPath();ctx.moveTo(-.2,-2.28);ctx.bezierCurveTo(-.36,-2.57,.1,-2.32,.16,-2.58);ctx.bezierCurveTo(.55,-2.33,.2,-2.15,-.2,-2.28);ctx.fill();path([[-.25,-2.23],[-.02,-2.31],[.2,-2.23]],'#5b4436',.04);ctx.restore();}
function rain(){ctx.strokeStyle='#d7e9ed20';ctx.lineWidth=1;for(let i=0;i<55;i++){let x=(i*173+time*43)%W,y=(i*113+time*185)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+14);ctx.stroke()}}
function boat(){if(mode!=='retry')return;const p=project(xPositions[step],0,(step+1)*14);ctx.strokeStyle='#efffffaa';ctx.lineWidth=3;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(p.x,p.y,25+i*20+Math.sin(time*3)*4,7+i*4,0,0,Math.PI*2);ctx.stroke();}}
function render(now){if(!paused)time+=Math.min(.04,(now-(last||now))/1000);last=now;const sky=ctx.createLinearGradient(0,0,0,H*.52);sky.addColorStop(0,'#263f53');sky.addColorStop(.55,'#7f999b');sky.addColorStop(1,'#d2c9a4');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<6;i++){const x=(i*W*.23+Math.sin(time*.025+i)*30)% (W+200),y=H*.15+Math.sin(i*4)*45;const g=ctx.createRadialGradient(x,y,0,x,y,180);g.addColorStop(0,'#ccd6cf20');g.addColorStop(1,'#ccd6cf00');ctx.fillStyle=g;ctx.fillRect(x-180,y-180,360,360)}sea();island();if(step<6){for(const offset of lanes)platform(step+1,offset);}platform(step);child();boat();rain();if(mode==='win'){ctx.fillStyle='#fce2a8';for(let i=0;i<45;i++){let x=(i*117)%W,y=(i*143+time*35)%H;ctx.globalAlpha=.5+.5*Math.sin(i+time);ctx.fillRect(x,y,3,7)}ctx.globalAlpha=1;}if(!ended&&!jump){const z=(step+1)*14;document.querySelectorAll('[data-answer]').forEach((el,i)=>{const x=xPositions[step+1]+lanes[i],p=project(x,wave(x,z)*.65+.7,z);el.style.left=p.x+'px';el.style.top=(p.y-2)+'px';el.style.rotate=(paused?0:Math.sin(time*1.6+z*.75)*2)+'deg';});}if(jump&&now-jump.at>=1100){const wrong=jump.wrong,jumpLanding=jump.targetX;jump=null;if(wrong)rescue();else{step++;xPositions[step]=jumpLanding;cameraX=jumpLanding+1.8;cam=step*14;if(step===6)win();else{mode='crossing';update();$('#encourage').textContent=`You landed! Question ${step+1} is ready — choose one of the three new stones.`;}}}requestAnimationFrame(render)}
function questions(){let x=100-a,y=100-b,l=a-y,r=x*y;return [{q:'Which base will help you cross?',h:'Three stones. Three answers. Choose your landing.',o:[10,100,1000],a:100},{q:`How far below 100 is ${a}?`,h:'Choose the positive shortfall. Watch your footing.',o:[-x,x,x+2],a:x},{q:`How far below 100 is ${b}?`,h:`Find the shortfall: 100 − ${b}.`,o:[y+2,-y,y],a:y},{q:'What goes on the left?',h:`Cross-subtract: ${a} − ${y}.`,o:[l,l+2,l-3],a:l},{q:'What goes on the right?',h:`Multiply the shortfalls: ${x} × ${y}.`,o:[r+10,r,r-1],a:r},{q:'The island is within reach. What is the product?',h:`Join ${l} and ${String(r).padStart(2,'0')}.`,o:[a*b+100,a*b-10,a*b],a:a*b}]}
function update(){ended=false;$('.question').classList.remove('reveal');void $('.question').offsetWidth;$('.question').classList.add('reveal');$('#modal').classList.add('hidden');$('.question').classList.remove('hidden');$('#answers').classList.remove('hidden');xPositions[step+1]=xPositions[step];const q=questions()[step];$('#step').textContent=`${a} × ${b}  ·  LEAP ${step+1} OF 6`;$('#prompt').textContent=q.q;$('#hint').textContent=q.h;$('#answers').innerHTML='<span class="next-label">CHOOSE YOUR NEXT LEAP ↓</span>'+q.o.map(n=>`<button class="choice fresh" data-answer="${n}" aria-label="Jump with answer ${n}">${n.toLocaleString()}</button>`).join('');document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>choose(+el.dataset.answer));$('#progress').textContent=`${step} / 6 leaps`;$('#dots').innerHTML=Array.from({length:6},(_,i)=>`<span class="dot ${i<step?'active':''}"></span>`).join('');mark()}
function choose(n){if(jump||ended)return;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('#answers').classList.add('hidden');jump={at:performance.now(),from:step,targetX:xPositions[step]+lanes[questions()[step].o.indexOf(n)],wrong:n!==questions()[step].a};$('#encourage').textContent=jump.wrong?'That stone is giving way…':'A brave leap. Arms out… find your balance!'}
function finish(){ended=true;$('#answers').classList.add('hidden');$('.question').classList.add('hidden');$('#modal').classList.remove('hidden');mark()}
function rescue(){mode='retry';finish();$('#modal').innerHTML='<div class="eyebrow">CROSSING FAILED · GAME OVER</div><h2>A splash. A fresh start.</h2><p>Rishi fell from the wrong stone. This attempt is over. Take a breath — your next adventure starts with a new puzzle.</p><button class="primary" id="again">Try a new crossing →</button>';$('#encourage').textContent='One missed step does not change what you can achieve. Try again with a fresh puzzle.';$('#again').onclick=newPuzzle}
function win(){mode='win';finish();$('#modal').innerHTML=`<div class="medal">🏅</div><div class="eyebrow">OCEAN EXPLORER · BADGE OF HONOR</div><h2>You found your courage.</h2><p>Six brave leaps. Wonder Island is yours.</p><div class="math">${a} × ${b} = ${(a*b).toLocaleString()}</div><button class="primary" id="again">Explore another island →</button>`;$('#progress').textContent='Island complete';$('#dots').innerHTML='✦ ✦ ✦ ✦ ✦ ✦';$('#encourage').textContent='Look back at how far you came. You worked out every step.';$('#again').onclick=newPuzzle}
function reset(){step=0;cam=0;cameraX=1.8;xPositions.fill(0);jump=null;mode='start';$('#encourage').textContent='The waves are strong. You are stronger than you think. Start with the base.';update()}
function newPuzzle(){const pairs=[[98,94],[96,92],[99,97],[95,93]].filter(([x,y])=>x!==a||y!==b);[a,b]=pairs[Math.floor(Math.random()*pairs.length)];reset()}
function mark(){document.querySelectorAll('[data-screen]').forEach(el=>{el.classList.toggle('selected',el.dataset.screen===mode);el.setAttribute('aria-pressed',String(el.dataset.screen===mode))})}
function screen(s){reset();if(s==='crossing'){mode=s;step=3;cam=42;update();$('#encourage').textContent='Open water now. Breathe, keep your arms out, and choose your next leap.'}if(s==='retry'){step=2;cam=28;rescue()}if(s==='win'){step=6;cam=84;win()}mark()}
$('#motion').onclick=()=>{paused=!paused;motionLabel()};function motionLabel(){$('#motion').textContent=paused?'Resume ocean motion':'Pause ocean motion'}motionLabel();document.querySelectorAll('[data-screen]').forEach(el=>el.onclick=()=>screen(el.dataset.screen));screen(new URLSearchParams(location.search).get('screen')||'start');requestAnimationFrame(render);
</script></html>
